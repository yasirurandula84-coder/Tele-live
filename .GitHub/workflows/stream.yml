name: Node.js Stream Service

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-run:
  
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg rubberband-cli

    - name: Install Dependencies
      run: npm install

    - name: Start Live Stream Process
      run: |
        node server.js &
        # සර්වර් එක ස්ටාර්ට් වී ප්‍රොසෙස් එක ස්ථාවර වන තෙක් ටිකක් රැඳී සිටීම
        sleep 5
        curl -X POST http://localhost:3000/start-live
        
        # GitHub Actions වර්ක්ෆ්ලෝ එක අඛණ්ඩව ක්‍රියාත්මක කර තබා ගැනීමට
        sleep 21600
        
